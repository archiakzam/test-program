<!DOCTYPE html>
<html>
<head>
    <title>System Monitor — gotop style</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1> System Monitor</h1>
            <div class="theme-switch"></div>
        </header>
        <div class="grid">
            <div class="card">
                <h2>CPU</h2>
                <div class="gauge"><span id="cpu-val">0</span>%</div>
                <canvas id="cpuChart" width="400" height="150"></canvas>
                <div class="temp"> <span id="temp-val">--</span>°C</div>
            </div>
            <div class="card">
                <h2>Memory</h2>
                <div class="gauge"><span id="ram-val">0</span>%</div>
                <canvas id="ramChart" width="400" height="150"></canvas>
            </div>
            <div class="card full-width">
                <h2>Disks</h2>
                <div id="disks-list"></div>
            </div>
        </div>
        <div class="process-panel">
            <h2>Processes <small>(click on header to sort)</small></h2>
            <table id="process-table">
                <thead>
                    <tr><th data-sort="pid">PID</th>
                        <th data-sort="name">Name</th>
                        <th data-sort="cpu">CPU%</th>
                        <th data-sort="mem_mb">MEM (MB)</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
